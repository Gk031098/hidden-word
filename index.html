<style>
:root{
  color-scheme:dark;
  --felt:#16302A; --felt-2:#1C3B33; --felt-edge:#0F231E;
  --wood:#F1E2C4; --wood-edge:#C9B48C; --wood-ink:#2A2118;
  --ink:#F4EFE3; --muted:#A9BDB4; --line:rgba(244,239,227,.14);
  --hit:#2FA36B; --near:#E3A42B; --miss:#44544F;
  --accent:#F28C5B; --focus:#FFE08A;
  --panel:#11261F; --shadow:0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--felt);color:var(--ink);font:16px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:radial-gradient(120% 80% at 50% 0%,var(--felt-2) 0%,var(--felt) 55%,var(--felt-edge) 100%);
  padding:0 16px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:14px 18px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mini{display:flex;gap:3px}
.logo .mini i{width:18px;height:18px;border-radius:4px;background:var(--wood);box-shadow:inset 0 -2px 0 var(--wood-edge);animation:wiggle 3.2s ease-in-out infinite}
.logo .mini i:nth-child(2){background:var(--near);box-shadow:inset 0 -2px 0 #b57f19;animation-delay:.15s}
.logo .mini i:nth-child(3){background:var(--hit);box-shadow:inset 0 -2px 0 #1f7a4e;animation-delay:.3s}
@keyframes wiggle{0%,80%,100%{transform:translateY(0) rotate(0)}85%{transform:translateY(-4px) rotate(-6deg)}90%{transform:translateY(0) rotate(4deg)}}
.logo h1{font:700 clamp(20px,6.2vw,26px)/1 "Fredoka",system-ui,sans-serif;margin:0;letter-spacing:.01em;white-space:nowrap}
.icons{display:flex;gap:6px}
.icon{width:38px;height:38px;flex:none;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.18);display:grid;place-items:center;font-weight:800;font-size:15px;transition:transform .12s,background .2s}
.icon:hover{background:rgba(255,255,255,.07)}
.icon:active{transform:scale(.92)}
.icon[aria-pressed="false"]{opacity:.5}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:rgba(0,0,0,.22);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-weight:800;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--wood);color:var(--wood-ink)}
.info{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;font-size:14px;color:var(--muted)}
.info b{color:var(--ink)}
.hintbtn{border:1.5px dashed var(--near);background:transparent;color:var(--near);border-radius:99px;padding:5px 12px;font-weight:800;font-size:13px}
.hintbtn:disabled{opacity:.35;cursor:default}
.hintline{display:flex;gap:6px;justify-content:center;min-height:0}
.hintline span{width:26px;height:26px;border-radius:7px;border:1.5px dashed var(--line);display:grid;place-items:center;font:700 14px "Fredoka",sans-serif;color:var(--muted)}
.hintline span.on{border:0;background:var(--hit);color:#fff;animation:pop .35s}

/* board */
.board{display:grid;grid-template-rows:repeat(6,1fr);gap:7px;width:min(100%,340px,max(230px,calc((100svh - 450px)*.83)));margin:2px auto 0}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.row.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.tile{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font:700 clamp(26px,8vw,34px)/1 "Fredoka",sans-serif;text-transform:uppercase;
  border:2px solid rgba(244,239,227,.16);background:rgba(0,0,0,.14);color:var(--ink);user-select:none;transform-style:preserve-3d;animation:enter .45s backwards}
@keyframes enter{from{opacity:0;transform:scale(.6) translateY(8px)}}
.tile.filled{border-color:transparent;background:var(--wood);color:var(--wood-ink);box-shadow:inset 0 -4px 0 var(--wood-edge),0 6px 12px -6px rgba(0,0,0,.6);animation:pop .12s}
@keyframes pop{50%{transform:scale(1.13)}}
.tile.hit,.tile.near,.tile.miss{border-color:transparent;color:#fff}
.tile.hit{background:var(--hit);box-shadow:inset 0 -4px 0 #1f7a4e}
.tile.near{background:var(--near);box-shadow:inset 0 -4px 0 #b57f19}
.tile.miss{background:var(--miss);box-shadow:inset 0 -4px 0 #34413d;color:#d7ddd9}
.tile.flip{animation:flip .5s ease-in-out both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.tile.win{animation:bounce .8s ease both}
@keyframes bounce{0%,20%{transform:translateY(0)}40%{transform:translateY(-26px)}50%{transform:translateY(4px)}60%{transform:translateY(-12px)}80%{transform:translateY(2px)}100%{transform:translateY(0)}}
.tile.lose{animation:sink .7s ease both}
@keyframes sink{40%{transform:translateY(6px) rotate(-3deg)}100%{transform:translateY(0)}}

/* keyboard */
.kb{display:flex;flex-direction:column;gap:7px;margin-top:auto;user-select:none}
.kb .r{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:44px;height:54px;border:0;border-radius:9px;background:#D9CDB3;color:var(--wood-ink);font:700 17px "Fredoka",sans-serif;text-transform:uppercase;
  box-shadow:inset 0 -3px 0 #b3a483;transition:background .3s,color .3s,transform .08s}
.key.wide{max-width:68px;flex:1.5;font-size:13px;letter-spacing:.02em}
.key:active,.key.press{transform:translateY(2px) scale(.96);box-shadow:inset 0 -1px 0 #b3a483}
.key.hit{background:var(--hit);color:#fff;box-shadow:inset 0 -3px 0 #1f7a4e}
.key.near{background:var(--near);color:#fff;box-shadow:inset 0 -3px 0 #b57f19}
.key.miss{background:#33413C;color:#8fa099;box-shadow:inset 0 -3px 0 #26312d}
.key svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

/* toast */
.toasts{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:40;pointer-events:none}
.toast{background:var(--ink);color:var(--felt);font-weight:800;padding:9px 16px;border-radius:10px;box-shadow:var(--shadow);animation:toastIn .25s ease,toastOut .3s ease forwards;animation-delay:0s,var(--life,1.6s);white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-6px)}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,14,11,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(100%,440px);max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:20px 20px 22px;box-shadow:var(--shadow);animation:up .35s cubic-bezier(.2,.9,.3,1.2)}
@media (min-height:700px){.scrim{align-items:center}}
@keyframes up{from{opacity:0;transform:translateY(40px) scale(.97)}}
.modal h2{font:700 24px/1.15 "Fredoka",sans-serif;margin:0 0 6px}
.modal p{margin:6px 0;color:var(--muted)}
.modal .close{float:right;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:18px;line-height:1}
.ex{display:flex;gap:5px;margin:10px 0 4px}
.ex .tile{width:38px;font-size:20px;border-radius:8px;animation:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px;text-align:center}
.stats b{display:block;font:700 28px/1.1 "Fredoka",sans-serif;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.dist{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.dist .d{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:center;font:700 13px "Fredoka",sans-serif}
.dist .bar{background:var(--miss);color:#fff;border-radius:6px;padding:2px 8px;text-align:right;min-width:26px;width:0;transition:width .7s cubic-bezier(.2,.9,.3,1);font-variant-numeric:tabular-nums}
.dist .bar.me{background:var(--hit)}
.answer{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
.answer .tile{width:44px;font-size:22px;animation:flip .5s both}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{flex:1;min-width:130px;border:0;border-radius:12px;padding:12px 14px;font-weight:800;font-size:15px;background:var(--wood);color:var(--wood-ink);box-shadow:inset 0 -3px 0 var(--wood-edge);transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--hit);color:#fff;box-shadow:inset 0 -3px 0 #1f7a4e}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.next{margin-top:12px;text-align:center;font-size:14px;color:var(--muted)}
.next b{font:700 20px "Fredoka",sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;display:block}
.lvl-note{font-size:13px;color:var(--muted);margin-top:8px}

.lb{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.lbr{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.045);animation:rowIn .35s backwards}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}}
.lbr.me{box-shadow:inset 0 0 0 1.5px var(--hit)}
.lbr .rk{font:700 15px "Fredoka",sans-serif;color:var(--muted);text-align:center}
.lbr .rk.top{color:var(--near)}
.lbr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.lbr .nm small{font-weight:700;color:var(--near);font-size:11px;margin-left:6px}
.lbr .you{font-size:10px;font-weight:800;background:var(--wood);color:var(--wood-ink);border-radius:99px;padding:1px 6px;margin-left:6px}
.lbr .sc{font:700 16px "Fredoka",sans-serif;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.lbr .sc.x{color:#e07a6a}
.mg{display:grid;grid-template-columns:repeat(5,7px);gap:1.5px}
.mg i{width:7px;height:7px;border-radius:2px}.mg .h{background:var(--hit)}.mg .n{background:var(--near)}.mg .m{background:var(--miss)}
.lbtabs{display:flex;gap:6px;margin-top:10px}
.lbtabs button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:6px;font-weight:800;font-size:13px;color:var(--muted)}
.lbtabs button[aria-pressed="true"]{background:var(--wood);color:var(--wood-ink);border-color:var(--wood)}
.nameform{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.nameform label{font-weight:800;font-size:14px;width:100%}
.nameform input{flex:1;min-width:0;font:inherit;font-weight:700;color:var(--ink);background:rgba(0,0,0,.25);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.nameform input:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.nameform .btn{flex:none;min-width:0;padding:10px 16px}
.lbnote{font-size:13px;color:var(--muted);margin-top:8px}
.sep{height:1px;background:var(--line);margin:16px 0 4px}
.sig{display:flex;align-items:center;gap:10px;justify-content:center;font-size:12.5px;color:var(--muted);padding-top:4px}
.sig b{color:var(--ink);font-family:"Fredoka",sans-serif;font-weight:600;font-size:13.5px}
.sig i{flex:1;max-width:60px;height:1px;background:var(--line)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
@media (max-width:430px){.logo .mini{display:none}.logo h1{font-size:clamp(18px,5.2vw,24px)}.icon{width:32px;height:32px;border-radius:9px}.icon svg{width:18px;height:18px}.icons{gap:4px}.app{gap:10px}.seg button{padding:6px 10px;font-size:13px}}
@media (max-width:380px){.key{height:50px;font-size:15px}.kb .r{gap:4px}.seg button{padding:6px 9px}}
@media (max-width:340px){.logo h1{font-size:16px}.icon{width:29px;height:29px}.icons{gap:3px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">

</div>

}
function blip(f,delay,dur,type,vol,to,out){

}

    if(S2.bass==='eighth'&&i%2===0)mtone(ch[0]-12,t,'sawtooth',.065,.18,700,out);

    if(S2.drums===2){if(i%4===0)mkick(t,.4,out);if(i%2===1)mnoise(t,'highpass',8000,.025,.035,out);if(i===4||i===12)mnoise(t,'bandpass',1800,.08,.12,out);}
    r.nextT+=s16;r.step++;
  }
}
function endRun(r,fade){if(!r||!ac)return;r.until=ac.currentTime+fade;r.gain.gain.cancelScheduledValues(ac.currentTime);r.gain.gain.setValueAtTime(r.gain.gain.value,ac.currentTime);r.gain.gain.linearRampToValueAtTime(0,ac.currentTime+fade);setTimeout(()=>{clearInterval(r.timer);try{r.gain.disconnect();}catch(e){}},fade*1000+800);}
function musicPlay(level){
  if(!musicOn||!audio())return;

  endRun(run,.8);
  const g=ac.createGain();g.gain.value=0;g.connect(musOut);
  const r={level,step:0,nextT:ac.currentTime+.08,until:Infinity,gain:g};
  g.gain.linearRampToValueAtTime(SONGS[level].vol,ac.currentTime+1.5);
  r.timer=setInterval(()=>schedule(r),25);run=r;schedule(r);
}

/* ================= scoring ================= */
function score(guess,answer){
  const res=Array(5).fill('miss'),left={};
  for(let i=0;i<5;i++){if(guess[i]===answer[i])res[i]='hit';else left[answer[i]]=(left[answer[i]]||0)+1;}
  for(let i=0;i<5;i++){if(res[i]!=='hit'&&left[guess[i]]){res[i]='near';left[guess[i]]--;}}
  return res;
}
function strictProblem(guess){
  for(const g of G.guesses){const sc=score(g,G.answer);
    for(let i=0;i<5;i++)if(sc[i]==='hit'&&guess[i]!==g[i])return `Letter ${i+1} must be ${g[i].toUpperCase()}`;
    const need={};for(let i=0;i<5;i++)if(sc[i]!=='miss')need[g[i]]=(need[g[i]]||0)+1;
    for(const [ch,n] of Object.entries(need)){const have=[...guess].filter(c=>c===ch).length;if(have<n)return `Your guess must include ${ch.toUpperCase()}`;}
  }
  for(const h of G.hints)if(guess[h]!==G.answer[h])return `Letter ${h+1} must be ${G.answer[h].toUpperCase()}`;
  return null;
}

function del(){if(busy||G.done||modalOpen())return;if(!G.cur.length)return;G.cur=G.cur.slice(0,-1);S.del();flashKey('del');render();}
function shakeRow(msg){const row=board.children[G.guesses.length];row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');S.bad();toast(msg);}
function submit(){
  if(busy||G.done||modalOpen())return;startMusicIfNeeded();flashKey('enter');
  const g=G.cur;
  if(g.length<5)return shakeRow('Not enough letters');
  if(!VALID.has(g))return shakeRow('Not in word list');
  if(LEVELS[level].strict){const p=strictProblem(g);if(p)return shakeRow(p);}
  busy=true;
  const r=G.guesses.length,row=board.children[r],sc=score(g,G.answer);
  G.guesses.push(g);G.cur='';

  saveGame();

    setTimeout(()=>{t.style.animationDelay='0ms';t.classList.add('flip');S.flip(sc[i],i);},i*280);

  });
  setTimeout(()=>{
    [...row.children].forEach((t,i)=>t.className='tile '+sc[i]);
    paintKeys();busy=false;

    else if(lost){finish(false,row);}

}

/* ================= confetti ================= */
function confetti(){
  const cv=$('#confetti'),ctx=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#2FA36B','#E3A42B','#F1E2C4','#F28C5B','#8FD3B6'];
  const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.38,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],life:0}));
  let f=0;(function step(){f++;ctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-f/150);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore();}
    if(f<150)requestAnimationFrame(step);else ctx.clearRect(0,0,innerWidth,innerHeight);})();
}

/* ================= hints ================= */
function useHint(){
  const L=LEVELS[level];if(G.done||G.hints.length>=L.hints||busy)return;
  const known=new Set(G.hints);for(const g of G.guesses){const sc=score(g,G.answer);sc.forEach((s,i)=>{if(s==='hit')known.add(i);});}
  const open=[0,1,2,3,4].filter(i=>!known.has(i));
  if(!open.length){toast('You already know every letter!');return;}
  const i=open[Math.floor(Math.random()*open.length)];G.hints.push(i);saveGame();S.hint();
  toast(`Letter ${i+1} is ${G.answer[i].toUpperCase()}`,2);render();startMusicIfNeeded();
}

/* ================= wiring ================= */
function setMode(m){if(busy)return;mode=m;store.set('hw-mode',m);musicStop();newGame();}
function setLevel(l){if(busy)return;level=l;store.set('hw-level',l);musicStop();newGame();}
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{S.tap();setMode(b.dataset.m);});
document.querySelectorAll('#lvlSeg button').forEach(b=>b.onclick=()=>{S.tap();setLevel(b.dataset.l);toast(LEVELS[b.dataset.l].name+' · '+(b.dataset.l==='easy'?'2 hints per game':b.dataset.l==='hard'?'clues must be reused':'no hints'),1.8);});
$('#bHint').onclick=useHint;
$('#bHelp').onclick=showHelp;
$('#bBoard').onclick=()=>showBoard(level);
$('#bStats').onclick=()=>{if(G.done&&mode==='daily')showResult();else showStats();};
const bSfx=$('#bSfx'),bMusic=$('#bMusic');
bSfx.setAttribute('aria-pressed',sfxOn);bMusic.setAttribute('aria-pressed',musicOn);
bSfx.onclick=()=>{sfxOn=!sfxOn;store.set('hw-sfx',sfxOn);bSfx.setAttribute('aria-pressed',sfxOn);if(sfxOn)S.tap();toast(sfxOn?'Sounds on':'Sounds off',1.2);};
bMusic.onclick=()=>{musicOn=!musicOn;store.set('hw-music',musicOn);bMusic.setAttribute('aria-pressed',musicOn);S.tap();if(musicOn){if(!G.done)musicPlay(level);}else musicStop();toast(musicOn?'Music on':'Music off',1.2);};
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(modalOpen()){if(e.key==='Escape')closeModal();return;}
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='Enter'){e.preventDefault();submit();}
  else if(e.key==='Backspace'){e.preventDefault();del();}
  else if(/^[a-z]$/i.test(e.key))typeKey(e.key.toLowerCase());
});

buildKb();newGame();
if(!store.get('hw-seen-help',false)){store.set('hw-seen-help',true);setTimeout(showHelp,500);}
else if(G.done&&mode==='daily')setTimeout(showResult,600);
})();
</script>
